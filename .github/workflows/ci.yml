# Runs on every push and pull request, in GitHub's cloud — no local machine
# needed. 1) self-test of the Claude Code setup; 2) when game/project.godot
# exists: import, parse-check every script, run the gdUnit4 suite.
# Godot version: GODOT_VERSION below (keep it equal to godot_version patch you use).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (structure, hooks, profiles, tools)
        run: bash tools/selftest.sh
      - name: Localization check
        if: hashFiles('game/locale/strings.csv') != ''
        run: bash tools/l10n.sh check

  godot:
    runs-on: ubuntu-latest
    needs: selftest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Is there a Godot project yet?
        id: project
        run: |
          if [ -f game/project.godot ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "::notice::No game/project.godot yet (run /start) — Godot steps skipped."; fi

      - name: Cache Godot
        if: steps.project.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.project.outputs.exists == 'true'
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
            chmod +x ~/godot/godot
          fi
          ~/godot/godot --headless --version
          # Point the project tools at this Godot (workspace copy only).
          sed -i -E "s|^godot_bin:[^#]*|godot_bin: \"$HOME/godot/godot\"  |" project.yaml

      - name: Import project
        if: steps.project.outputs.exists == 'true'
        run: bash tools/setup-godot.sh

      - name: Parse-check all scripts
        if: steps.project.outputs.exists == 'true'
        run: bash tools/parse-all.sh

      - name: Install gdUnit4 when not committed
        if: steps.project.outputs.exists == 'true' && hashFiles('game/addons/gdUnit4/plugin.cfg') == ''
        run: |
          grep -qE '^test_framework:[[:space:]]*none' project.yaml && exit 0
          bash tools/install-gdunit4.sh

      - name: Run tests
        if: steps.project.outputs.exists == 'true'
        run: bash tools/run-tests.sh

      - name: Upload test log
        if: failure() && steps.project.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            /tmp/gsl-tests.log
            /tmp/gsl-import.log
            game/reports/
          if-no-files-found: ignore
